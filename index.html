<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Emoji Founders — E-Cell Plaksha</title>
<meta name="description" content="Ten companies. Three emojis each. A guessing game for founders, by E-Cell Plaksha.">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --bg:#0A0A0A; --frame:#1B1B1B; --face:#131313; --ink:#F5F3EF; --muted:#9A958E;
  --accent:#F0604C; --accent-hi:#FF7159; --line:#242424;
  --font:'Space Grotesk',sans-serif; --ease:cubic-bezier(0.16,1,0.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);min-height:100dvh;display:flex;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#160B08}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.view [tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
button{font-family:var(--font)}

/* ambient */
.glow{position:fixed;left:50%;top:34%;width:min(92vw,880px);aspect-ratio:1;border-radius:50%;translate:-50% -50%;background:radial-gradient(circle,rgba(240,96,76,.10) 0%,transparent 62%);pointer-events:none;z-index:0}
.grain{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:.05;background-size:180px;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
#cursor{position:fixed;left:0;top:0;width:34px;height:34px;border:1px solid rgba(245,243,239,.5);border-radius:50%;translate:-50% -50%;mix-blend-mode:difference;pointer-events:none;z-index:85;opacity:0}

/* header / footer */
.site-head{position:fixed;top:0;left:0;right:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 22px;padding-top:calc(16px + env(safe-area-inset-top))}
.head-left{justify-self:start}
.head-left img{height:22px;width:auto;display:block;opacity:.92}
.brand-fallback{font-weight:700;font-size:10px;letter-spacing:.22em;color:var(--muted)}
.wordmark{font-weight:700;font-size:.95rem;letter-spacing:.18em;text-align:center;text-transform:uppercase}
.wordmark-sub{display:block;font-weight:500;font-size:8px;letter-spacing:.32em;color:var(--muted);margin-top:5px}
.head-right{justify-self:end;display:flex;align-items:baseline;gap:8px}
.score-label{font-size:9px;letter-spacing:.24em;color:var(--muted)}
#hud-score{font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums;display:inline-block}
.site-foot{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:16px 22px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.foot-left{display:flex;align-items:center;gap:10px}
#hud-round{font-weight:500;font-size:.8rem;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.ring-track{fill:none;stroke:#2A2A2A;stroke-width:2}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:56.55;stroke-dashoffset:56.55}
.foot-btn{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;color:var(--ink);font-weight:500;font-size:.8rem;padding:6px}
.foot-btn svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--ease)}
.foot-btn:hover svg{transform:rotate(180deg)}

/* stage: views share one grid cell -> zero layout jump */
#stage{position:relative;z-index:10;display:grid;width:100%;max-width:620px;margin:auto;padding:92px 20px 96px}
.view{grid-area:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;visibility:hidden;pointer-events:none}
.view.is-active{visibility:visible;pointer-events:auto}

/* cards */
.card-row{display:flex;justify-content:center;gap:clamp(12px,3vw,22px);margin-bottom:clamp(20px,4vh,34px)}
.ecard{width:clamp(86px,23vw,116px);aspect-ratio:100/140;background:var(--frame);border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px #242424;will-change:transform}
.ecard-inner{width:100%;height:100%}
.card-face{position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#0F0F0F 0%,#26150F 36%,#E8604C 100%)}
.card-face::after{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;background-size:140px;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.lines{position:absolute;inset:0;width:100%;height:100%}
.lines path{fill:none;stroke:#FF8A73;stroke-width:.8;opacity:.5}
.card-emoji{position:relative;z-index:1;font-size:clamp(2.4rem,8.5vw,3.4rem);line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}

/* start */
.rules{color:var(--ink);font-size:.95rem;line-height:1.6;text-align:center;max-width:44ch;margin-bottom:30px}
.cta-row{display:flex;flex-direction:column;align-items:center;gap:14px}
.hint{font-size:.75rem;color:var(--muted)}
kbd{font:inherit;border:1px solid #333;border-radius:5px;padding:1px 6px;background:#161616}

/* buttons */
.btn{font-size:.95rem;font-weight:700;padding:15px 30px;min-height:50px;border-radius:999px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation;transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.btn-primary{background:var(--accent);color:#160B08}
.btn-primary:hover{background:var(--accent-hi)}
.btn-ghost{background:transparent;color:var(--ink);border-color:#333;font-weight:500}
.btn-ghost:hover{background:rgba(255,255,255,.04);border-color:var(--ink)}
.arrow{transition:translate .2s var(--ease)}
.btn:hover .arrow{translate:4px 0}

/* game */
.prompt{font-weight:500;font-size:1.05rem;color:var(--ink);text-align:center;margin-bottom:16px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-bottom:16px}
.option-btn{background:var(--frame);padding:6px;border-radius:14px;border:1px solid var(--line);cursor:pointer;text-align:left;transition:border-color .22s var(--ease)}
.option-face{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--face);border-radius:9px;padding:13px 14px;min-height:50px;transition:background-color .22s var(--ease)}
.option-face::after{content:"";position:absolute;inset:0;opacity:.1;pointer-events:none;background-size:140px;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.option-label{position:relative;z-index:1;font-weight:500;font-size:.95rem;color:var(--ink);transition:color .22s var(--ease)}
.option-tail{position:relative;z-index:1;display:flex;align-items:center}
.option-btn:hover:not(:disabled){border-color:rgba(240,96,76,.45)}
.option-btn:hover:not(:disabled) .option-face{background:#181818}
.option-btn:disabled{cursor:default}
.keycap{font-size:.72rem;color:var(--muted);border:1px solid #2E2E2E;background:#1D1D1D;padding:3px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.option-btn.is-correct{border-color:rgba(240,96,76,.8)}
.option-btn.is-correct .option-face{background:linear-gradient(180deg,#1A1A1A 0%,#E8604C 130%)}
.option-btn.is-correct .option-label{color:#fff;font-weight:700}
.option-btn.is-wrong .option-face{background:#101010}
.option-btn.is-wrong .option-label{color:var(--muted)}
.check,.cross{width:18px;height:18px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.check{stroke:#fff}
.cross{stroke:rgba(255,255,255,.75)}
.check path{stroke-dasharray:24;stroke-dashoffset:24}
.cross path{stroke-dasharray:17;stroke-dashoffset:17}

/* reveal */
.reveal-slot{width:100%;min-height:6.6rem;margin-bottom:8px;text-align:center}
.reveal-head{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-bottom:6px}
.reveal-name{font-weight:700;font-size:1.3rem}
.reveal-year{color:var(--accent);font-size:.72rem;letter-spacing:.18em;font-weight:500}
.reveal-fact{color:var(--muted);font-size:.92rem;line-height:1.55;max-width:44ch;margin:0 auto}
.next-slot{height:56px;width:100%;display:flex;justify-content:center;align-items:flex-start}
#btn-next{opacity:0;pointer-events:none}
.chip{position:absolute;color:var(--accent);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;pointer-events:none;z-index:20}

/* end */
.kicker{font-size:.7rem;letter-spacing:.3em;color:var(--accent);font-weight:500;margin-bottom:14px}
.end-title{font-weight:700;font-size:clamp(1.9rem,6vw,2.6rem);letter-spacing:-.01em;margin-bottom:26px;text-align:center}
.score-row{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.odometer{display:flex;font-size:clamp(4rem,15vw,6.3rem);font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.odo-col{height:1em;overflow:hidden}
.odo-strip{display:flex;flex-direction:column}
.odo-strip span{display:block;height:1em;line-height:1}
.score-total{color:var(--accent);font-weight:500;font-size:clamp(1.2rem,4vw,1.7rem)}
.end-meta{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;margin-bottom:16px}
.verdict{color:var(--accent);font-weight:500;font-size:1.05rem;margin-bottom:34px;text-align:center}
.end-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* toast / confetti */
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));translate:-50% 0;background:var(--frame);border:1px solid #333;color:var(--ink);padding:11px 20px;border-radius:999px;font-size:.85rem;font-weight:500;z-index:90;opacity:0;pointer-events:none}
.confetti-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:88}
.confetti{position:absolute;left:0;top:0;will-change:transform}

@media (max-width:600px){
  .options{grid-template-columns:1fr}
  .reveal-slot{min-height:7.4rem}
  .end-actions{flex-direction:column;width:100%}
  .end-actions .btn{width:100%}
  .site-head,.site-foot{padding-left:16px;padding-right:16px}
}
@media (hover:none){.keycap,.hint,#cursor{display:none}}
@media (max-height:760px) and (min-width:601px){
  .ecard{width:96px}
  .card-row{margin-bottom:16px}
  .reveal-slot{min-height:5.8rem}
  #stage{padding-top:84px;padding-bottom:88px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div id="cursor" aria-hidden="true"></div>

<header class="site-head" id="site-head">
  <div class="head-left">
    <img src="assets/logo.png" alt="E-Cell Plaksha" onerror="this.remove();var f=document.getElementById('brand-fallback');if(f)f.hidden=false;">
    <span id="brand-fallback" class="brand-fallback" hidden>E-CELL</span>
  </div>
  <h1 class="wordmark">Emoji Founders<span class="wordmark-sub">E-Cell · Plaksha University</span></h1>
  <div class="head-right"><span class="score-label">SCORE</span><span id="hud-score">0</span></div>
</header>

<main id="stage">
  <section id="view-start" class="view is-active" aria-label="Start screen">
    <div class="card-row" id="intro-cards" data-animate>
      <div class="ecard" data-tilt="-4"><div class="ecard-inner"><div class="card-face"><svg class="lines" viewBox="0 0 100 140" preserveAspectRatio="none" aria-hidden="true"><path d="M1 1 H99 V139 H1 Z M1 38 H99 M62 1 V139 M1 139 L62 38 M1 38 L99 96 M62 38 L99 22" vector-effect="non-scaling-stroke"/></svg><span class="card-emoji">&#128269;</span></div></div></div>
      <div class="ecard" data-tilt="1"><div class="ecard-inner"><div class="card-face"><svg class="lines" viewBox="0 0 100 140" preserveAspectRatio="none" aria-hidden="true"><path d="M1 1 H99 V139 H1 Z M1 38 H99 M62 1 V139 M1 139 L62 38 M1 38 L99 96 M62 38 L99 22" vector-effect="non-scaling-stroke"/></svg><span class="card-emoji">&#127822;</span></div></div></div>
      <div class="ecard" data-tilt="4"><div class="ecard-inner"><div class="card-face"><svg class="lines" viewBox="0 0 100 140" preserveAspectRatio="none" aria-hidden="true"><path d="M1 1 H99 V139 H1 Z M1 38 H99 M62 1 V139 M1 139 L62 38 M1 38 L99 96 M62 38 L99 22" vector-effect="non-scaling-stroke"/></svg><span class="card-emoji">&#128230;</span></div></div></div>
    </div>
    <p class="rules" data-animate>Rules are simple. Ten companies, three emojis each. Read the clues, pick the company, earn 10 points a hit. Score 70+ to earn the confetti.</p>
    <div class="cta-row" data-animate>
      <button id="btn-start" class="btn btn-primary" data-magnetic>Start guessing <span class="arrow" aria-hidden="true">&#8594;</span></button>
      <p class="hint">or press <kbd>Enter</kbd></p>
    </div>
  </section>

  <section id="view-game" class="view" aria-label="Game screen" aria-hidden="true">
    <div class="card-row" id="emoji-row" data-animate></div>
    <p class="prompt" data-animate tabindex="-1">Guess the company</p>
    <div class="options" id="options" data-animate></div>
    <div class="reveal-slot" data-animate><div class="reveal" id="reveal" aria-live="polite"></div></div>
    <div class="next-slot" data-animate><button id="btn-next" class="btn btn-ghost">Next <span class="arrow" aria-hidden="true">&#8594;</span></button></div>
  </section>

  <section id="view-end" class="view" aria-label="Results screen" aria-hidden="true">
    <p class="kicker" data-animate>RESULTS</p>
    <h2 class="end-title" data-animate tabindex="-1">That&#8217;s a wrap.</h2>
    <div class="score-row" data-animate><div class="odometer" id="odometer"></div><span class="score-total">/ 100</span></div>
    <p class="end-meta" id="end-meta" data-animate></p>
    <p class="verdict" id="verdict" data-animate></p>
    <div class="end-actions" data-animate>
      <button id="btn-restart" class="btn btn-primary" data-magnetic>Play again <span class="arrow" aria-hidden="true">&#8635;</span></button>
      <button id="btn-share" class="btn btn-ghost">Share score</button>
    </div>
  </section>
</main>

<footer class="site-foot" id="site-foot">
  <div class="foot-left">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle class="ring-track" cx="11" cy="11" r="9"/><circle class="ring-fill" id="ring-fill" cx="11" cy="11" r="9" transform="rotate(-90 11 11)"/></svg>
    <span id="hud-round">00 / 10</span>
  </div>
  <button id="btn-shuffle" class="foot-btn" aria-label="Restart game">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h4l10 12h4m0 0-3-3m3 3-3 3M3 18h4l3.2-3.8M14.8 9.8 17 6h4m0 0-3-3m3 3-3 3"/></svg>
    <span>Restart</span>
  </button>
</footer>

<div class="toast" id="toast" role="status"></div>
<noscript><p style="text-align:center;padding:2rem;color:#F5F3EF">Emoji Founders needs JavaScript to run.</p></noscript>

<script>

    M.killTree(dom.emojis); M.killTree(dom.options); M.killTree(dom.reveal);

      var inner = document.createElement('div'); inner.className = 'ecard-inner';
